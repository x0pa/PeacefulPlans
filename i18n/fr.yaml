prob_result: "Votre estimation apparaîtra ici."
prob_note: "Ceci estime uniquement les frais de cour ou la taxe d'administration successorale. Ce n'est jamais le coût complet du règlement d'une succession, qui peut comprendre des honoraires d'avocat, de la comptabilité et des impôts dus par la succession. Les barèmes proviennent des sources des tribunaux et des gouvernements provinciaux énumérées ci dessous et portent la date de dernière vérification indiquée. Le Québec n'est pas dans ce calculateur : un testament notarié n'y passe pas par une vérification judiciaire, et les autres testaments suivent un processus différent. Information générale seulement, et non un avis juridique."
