home_tools_h2: "Des outils calmes, prêts quand vous l'êtes"
home_about_h2: "Tout au même endroit, avant que votre famille en ait besoin"
home_about_p: "Aujourd'hui, les réponses vivent en fragments. Un testament vit chez les avocats. Une directive médicale vit dans un ministère provincial de la Santé, sous un nom que la plupart des gens n'ont jamais entendu. Un lot de cimetière vit dans un cimetière. L'homologation vit dans les tribunaux. Peaceful Plans rassemble l'ensemble du tableau dans un seul endroit calme, pour qu'une famille puisse le compléter un après midi ordinaire, à son rythme, pendant que tout le monde est en santé."
