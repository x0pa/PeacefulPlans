home_tools_h2: "Calm tools, ready when you are"
home_about_h2: "Everything in one place, before your family needs it"
home_about_p: "Today the answers live in fragments. A will lives with lawyers. A medical directive lives with a provincial health ministry under a name most people have never heard. A burial plot lives with a cemetery. Probate lives with the courts. Peaceful Plans gathers the whole picture in one calm place, so a family can assemble it on an ordinary afternoon, at their own pace, while everyone is well."
